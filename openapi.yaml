openapi: 3.0.3
info:
  title: De-identification Service
  version: 1.0.0
  description: >
    Rule-based PII de-identification (regex + validation). No external APIs; text never leaves the process.
    Request and response bodies are never logged.
servers:
  - url: http://localhost:3000
security:
  - {}
  - apiKey: []
  - bearer: []
  - oauth2: [deidfr:write]
paths:
  /deidentify:
    post:
      summary: De-identify one text
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeidentifyRequest" }
            example:
              text: "Contact john.doe@example.com at +1-415-555-0134"
              entities: [EMAIL, PHONE]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeidentifyResponse" }
              example:
                deidentifiedText: "Contact [EMAIL] at [PHONE]"
                entitiesDetected: { EMAIL: 1, PHONE: 1 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /deidentify/batch:
    post:
      summary: De-identify up to 1000 records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    oneOf:
                      - type: string
                      - type: object
                        required: [text]
                        properties:
                          id: {}
                          text: { type: string, maxLength: 1000000 }
                entities: { $ref: "#/components/schemas/Entities" }
      responses:
        "200":
          description: One result per record, in order
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/DeidentifyResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /entities:
    get:
      summary: List supported and default entities
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  supported: { type: array, items: { type: string } }
                  default: { type: array, items: { type: string } }
  /health:
    get:
      summary: Liveness check (never requires an API key)
      security: []
      responses:
        "200":
          description: OK
components:
  securitySchemes:
    apiKey: { type: apiKey, in: header, name: X-API-Key }
    bearer: { type: http, scheme: bearer }
    oauth2:
      type: oauth2
      description: Only active when OAUTH_ISSUER is configured. Replace tokenUrl with your provider's.
      flows:
        clientCredentials:
          tokenUrl: http://localhost:4000/token
          scopes:
            deidfr:read: Read access
            deidfr:write: Call the de-identification endpoints
  schemas:
    Entities:
      type: array
      minItems: 1
      description: Case-insensitive entity names. Omit for the defaults (all core entities, NAME excluded).
      items:
        type: string
        example: EMAIL
    DeidentifyRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 1000000 }
        entities: { $ref: "#/components/schemas/Entities" }
    DeidentifyResponse:
      type: object
      properties:
        id: {}
        deidentifiedText: { type: string }
        entitiesDetected:
          type: object
          additionalProperties: { type: integer }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              requestId: { type: string }
